# Minimal local stack: Go API (in-process orchestrator). Build dashboard separately.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      GAIOL_DISABLE_AUTH: "1"
    env_file:
      - .env

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: "http://localhost:8080"
    depends_on:
      - web
